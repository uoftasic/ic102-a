# The whole course as one PDF:
#   quarto render docs --profile pdf --to typst      # writes docs/_book/*.pdf
# Chapter order follows the sidebar in _quarto.yml.

project:
  type: book
  output-dir: _book

book:
  title: "IC102-A — Working in Tiny Tapeout Repos (Analog)"
  subtitle: "Run an analog Tiny Tapeout project the way the team does: your own repo from the template, a layout that passes precheck, reviewed pull requests, and history you can use."
  author: "UofT ASIC Team"
  output-file: "ic102-a-course"
  chapters:
    - index.md
    - part: "Course path"
      chapters:
        - guide/getting-started.md
        - labs/lab-01-overview.md

format:
  typst:
    toc: true
    toc-depth: 1
