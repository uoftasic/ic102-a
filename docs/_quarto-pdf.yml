# The whole course as one PDF:
#   quarto render docs --profile pdf --to typst      # writes docs/_book/*.pdf
# Chapter order follows the sidebar in _quarto.yml.

project:
  type: book
  output-dir: _book

book:
  title: "IC102-A — Working in Tiny Tapeout Repos (Analog)"
  subtitle: "Make an analog Tiny Tapeout project from the template on your own GitHub account and get its layout through precheck."
  author: "UofT ASIC Team"
  output-file: "ic102-a-course"
  chapters:
    - index.md
    - part: "1. Your repository"
      chapters:
        - guide/getting-started.md
        - guide/git-in-one-page.md
        - guide/templates-forks-and-clones.md
        - labs/lab-01-your-repo-from-the-template-overview.md
    - part: "2. Runs that fail"
      chapters:
        - guide/what-a-cloud-runner-is.md
        - guide/reading-a-workflow-file.md
        - guide/the-analog-workflows.md
        - labs/lab-02-read-the-red-x-overview.md
    - part: "3. A layout that passes"
      chapters:
        - guide/the-analog-layout-kit.md
        - guide/what-precheck-checks.md
        - guide/your-tools-and-the-runners-tools.md
        - labs/lab-03-a-layout-that-passes-precheck-overview.md
    - part: "4. Review"
      chapters:
        - guide/pull-requests-and-review.md
        - guide/branch-rules.md
        - guide/layout-files-in-git.md
        - guide/how-open-source-projects-work.md
        - labs/lab-04-a-change-through-review-overview.md
    - part: "5. History"
      chapters:
        - guide/history-as-evidence.md
        - labs/lab-05-find-the-commit-that-broke-it-overview.md

format:
  typst:
    toc: true
    toc-depth: 1
